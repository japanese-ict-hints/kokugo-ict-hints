name: Collect (手動のみ)

# 運営者の判断により、収集は自動では回さない（2026-09-06）。
# 回すときは Actions から手動で実行する。ANTHROPIC_API_KEY が未登録のあいだは
# 要約を生成せず、候補を .cache/candidates/ に書き出すだけで終わる。
on:
  workflow_dispatch:
    inputs:
      group:
        description: '処理する群（空なら今週の群）'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund

      # .cache は成果物ではないが、seen.json を持ち越さないと毎回同じURLを取りに行く
      - uses: actions/cache@v4
        with:
          path: .cache
          key: collect-cache-${{ github.run_id }}
          restore-keys: collect-cache-

      - name: 収集
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node scripts/collect.ts ${{ inputs.group && format('--group {0}', inputs.group) || '' }} 2>&1 | tee collect.log

      - name: 差分があればPRを作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain src/content/tips)" ]; then
            echo "新しい事例はなかった"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "collect/$DATE"
          git add src/content/tips
          git commit -m "収集: $DATE

          scripts/collect.ts の自動実行。すべて status: draft。
          公開の可否は運営者が確認して published に変える（CLAUDE.md §5.1）。"
          git push -u origin "collect/$DATE"
          gh pr create --title "収集 $DATE" --body-file - <<'BODY'
          `scripts/collect.ts` の自動実行の結果です。

          **自動マージはしません。** 次を確認してから `status: published` に変えてください。

          - 要約が出典の言い回しをなぞっていないか
          - 学校名・教職員名・児童生徒が特定できる情報が入っていないか
          - `license` が `link-only` の事例で、本文を引用していないか
          - 国語の授業で本当に使えるか

          実行ログは Actions の `collect` ジョブを見てください。
          BODY
