  # 調べたが登録を見送ったホスト（2026-09-06）
  #   www.doken.hokkaido-c.ed.jp  北海道立教育研究所。事例の入口を特定できず
  #   www.edu-c.pref.aomori.jp    青森県総合学校教育センター。無断複製・転載の禁止が明記
  #   cms2.chiba-c.ed.jp          千葉県子どもと親のサポートセンター。国語の事例は見当たらない
  #   www.ishikawa-c.ed.jp        石川県教員総合研修センター。事例の入口を特定できず
  #   www.akita-c.ed.jp           秋田県総合教育センター。robots.txt を取得できず停止（§2.2）

denylist:
  - reason: 会員登録が必要
    hosts: []
  - reason: 無断転載禁止の明記あり
    hosts: []
  - reason: サービス終了（2026-05-13）。本文が失われている
    hosts: [edtechzine.jp]

# robots.txt の確認記録（2026-09-06）
robots_checked:
  bso.benesse.ne.jp: 200。対象パス（/miraiseed/fansite/usecase/ と /info/）は Disallow に該当しない
  www.canva.com: 200。/ja_jp/learn-grid/ に該当する Disallow なし
  www.mext.go.jp: 404（robots.txt なし）。RFC 9309 により制限なしとして扱う
  edtechzine.jp: サービス終了ページが返る。収集しない
