# robots.txt の確認記録（2026-09-06）
robots_checked:
  bso.benesse.ne.jp: 200。対象パス（/miraiseed/fansite/usecase/ と /info/）は Disallow に該当しない
  www.canva.com: 200。/ja_jp/learn-grid/ に該当する Disallow なし
  www.mext.go.jp: 404（robots.txt なし）。RFC 9309 により制限なしとして扱う
  edtechzine.jp: サービス終了ページが返る。収集しない
  www.kyoiku-shuppan.co.jp: 404（robots.txt なし）。RFC 9309 により制限なしとして扱う
  kyoiku.sho.jp: 200。Disallow は /wp-admin/ /wp-includes/ /wp-content/plugins/ /cgi-bin/ /?s= /feed/ /comments/ など。記事ページ（/数字/）と /tag/ は対象外
  www.mitsumura-tosho.co.jp: 200。Disallow は /application/ 配下など内部パスのみ。/webmaga/ は対象外
  tb.sanseido-publ.co.jp: 200。Disallow の記載なし（Sitemap のみ）。制限なしとして扱う
